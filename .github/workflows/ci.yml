name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, unit tests, release build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: ktlint and detekt
        run: ./gradlew ktlintCheck detekt --stacktrace
      - name: Unit tests
        run: ./gradlew :domain:test testDebugUnitTest --stacktrace
      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace
      - name: Release build (unsigned)
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
