name: Release

# A tag vX.Y.Z builds the Play bundle signed with the upload key and the unsigned APK, and creates a
# draft GitHub release. The APK is signed locally with the app signing key, which never enters CI
# (scripts/finish-github-release.sh, RELEASING.md). Run manually for a dry run with a throwaway key.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      MENSIS_GOOGLE_WEB_CLIENT_ID: ${{ vars.MENSIS_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        id: version
        run: |
          version=$(./gradlew -q :app:printVersion | tail -n 1)
          name=${version% *}
          code=${version#* }
          if ! [[ "$code" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read the version from Gradle: $version"
            exit 1
          fi
          echo "versionName $name, versionCode $code"
          if [ "$DRY_RUN" = false ]; then
            if [ "v$name" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME is not of the form vX.Y.Z (build version: $name)"
              exit 1
            fi
            changelog="fastlane/metadata/android/en-US/changelogs/$code.txt"
            if [ ! -s "$changelog" ]; then
              echo "::error::$changelog is missing"
              exit 1
            fi
            if [ "$(wc -m < "$changelog")" -gt 500 ]; then
              echo "::error::$changelog is longer than Play's 500 characters"
              exit 1
            fi
            if [ -z "$MENSIS_GOOGLE_WEB_CLIENT_ID" ]; then
              echo "::error::Repository variable MENSIS_GOOGLE_WEB_CLIENT_ID is not set; Drive backup would be unavailable"
              exit 1
            fi
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: ktlint, detekt, unit tests, Android Lint
        run: ./gradlew ktlintCheck detekt :domain:test testDebugUnitTest lintDebug --stacktrace

      - name: Upload key from secrets
        if: env.DRY_RUN == 'false'
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          for secret in UPLOAD_KEYSTORE_B64 UPLOAD_KEYSTORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Repository secret $secret is not set (RELEASING.md)"
              exit 1
            fi
          done
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"

      - name: Throwaway upload key (dry run)
        if: env.DRY_RUN == 'true'
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/upload.keystore" -storetype PKCS12 \
            -storepass dry-run-only -keypass dry-run-only -alias upload \
            -keyalg RSA -keysize 4096 -validity 1 -dname "CN=Mensis dry run"

      - name: Play bundle signed with the upload key
        env:
          MENSIS_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.keystore
          MENSIS_UPLOAD_KEYSTORE_PASSWORD: ${{ env.DRY_RUN == 'false' && secrets.UPLOAD_KEYSTORE_PASSWORD || 'dry-run-only' }}
          MENSIS_UPLOAD_KEY_ALIAS: ${{ env.DRY_RUN == 'false' && secrets.UPLOAD_KEY_ALIAS || 'upload' }}
          MENSIS_UPLOAD_KEY_PASSWORD: ${{ env.DRY_RUN == 'false' && secrets.UPLOAD_KEY_PASSWORD || 'dry-run-only' }}
        run: |
          ./gradlew :app:bundleRelease --stacktrace
          rm "$RUNNER_TEMP/upload.keystore"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep 'jar verified'

      - name: Unsigned APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect outputs
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/mensis-$NAME.aab"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/mensis-$NAME-unsigned.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mensis-$NAME-mapping.txt"
          (cd dist && sha256sum mensis-* > SHA256SUMS && cat SHA256SUMS)

      - name: Sign the APK with a throwaway key (dry run)
        if: env.DRY_RUN == 'true'
        env:
          NAME: ${{ steps.version.outputs.name }}
          MENSIS_KS_PASS: dry-run-only
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/app-signing.keystore" -storetype PKCS12 \
            -storepass dry-run-only -keypass dry-run-only -alias mensis \
            -keyalg RSA -keysize 4096 -validity 1 -dname "CN=Mensis dry run"
          scripts/sign-release-apk.sh "dist/mensis-$NAME-unsigned.apk" "$RUNNER_TEMP/app-signing.keystore" mensis \
            "$RUNNER_TEMP/mensis-$NAME-dry-run.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.name }}
          path: dist/
          if-no-files-found: error

      - name: Draft GitHub release
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Mensis $NAME" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$CODE.txt" \
            "dist/mensis-$NAME-unsigned.apk"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
